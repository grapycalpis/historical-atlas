<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  {{metadata}}
  <link rel="stylesheet" href="../app/style.css"><link rel="stylesheet" href="../app/map.css">
</head>
<body>
  <svg id="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
  <header class="mast">
    <div class="brand"><svg class="brandmark" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="18" fill="none" stroke="currentColor" stroke-width="1"/><path d="m26 1 4.2 18.9L46 8l-11.9 15.5L51 26l-17.8 3L44 44l-15.3-11L26 51l-3.4-18.2L8 44l11.4-15.2L1 26l18.8-3.2L8 8l15 11.4z" fill="currentColor"/><path d="M26 7v19l-4.2-4.2zm0 19h18l-14.1 3.2zm0 0v19l4-15zm0 0H8l14-4z" fill="#315650"/></svg><div>時序地圖集<small>HISTORICAL ATLAS</small></div></div>
    <nav aria-label="閱讀工具"><a class="mastBtn" href="../index.html">時期目錄</a><button id="sourceOpen" class="mastBtn"><i data-icon="book"></i><span>史料索引</span></button><button id="helpOpen" class="mastBtn"><i data-icon="info"></i><span>使用指南</span></button></nav>
  </header>
  <main>
    <div class="titleRow">
      <div><div class="kicker"><span class="line"></span> {{subject}} <b>／</b> 互動歷史地圖</div><h1>{{title}}</h1></div>
      <div class="period"><span>{{years}}</span><small>{{subtitle}}</small></div>
    </div>
    <div class="workbench">
      <aside class="rail">
        <div class="sectionhead"><i data-icon="chapters"></i><h2>章節導覽</h2></div>
        <div id="chapters" aria-label="選擇章節"></div>
        <div class="railEvents"><div class="minorHead">本章事件 <button id="eventListOpen" class="iconBtn" title="展開事件目錄" aria-label="展開事件目錄"><i data-icon="list"></i></button></div><div id="miniList"></div></div>
        <button id="baseline" class="resetBtn"><i data-icon="reset"></i>{{reset}}</button>
      </aside>
      <section class="mapColumn" aria-label="歷史地圖與時間軸">
        <div class="mapHead"><div class="mapTitle"><i data-icon="map"></i><h2>歷史地圖</h2></div><div class="mapActions"><button id="compareOpen" class="toolBtn"><i data-icon="compare"></i>時點比較</button><button id="layerOpen" class="toolBtn" aria-expanded="false"><i data-icon="layers"></i>圖層</button></div></div>
        <div class="mapStage" id="stage">
          <div id="map" class="mapSurface" aria-label="目前事件地圖"></div>
          <div class="mapView"><i data-icon="globe"></i><select id="view" aria-label="地圖範圍"><option value="region">{{region}}</option><option value="focus">事件周邊</option><option value="world">世界全圖</option></select></div>
          <button id="mapCredit" title="查看底圖年代、來源與已知限制"></button><div class="zoomTools"><button aria-label="放大地圖" data-zoom="1.35"><i data-icon="plus"></i></button><button aria-label="縮小地圖" data-zoom="0.74074"><i data-icon="minus"></i></button><button aria-label="重設地圖視野" data-zoom="0"><i data-icon="center"></i></button></div>
          <div id="layerPanel" hidden><div class="minorHead">地圖圖層<button class="iconBtn" id="layerClose" aria-label="關閉圖層"><i data-icon="close"></i></button></div><div id="layerItems"></div></div>
        </div>
        <div class="legend" id="legend"></div>
        <section class="player">
          <div class="playTop"><div class="mapTitle"><i data-icon="timeline"></i><h2>事件時間軸</h2></div><button id="showTimeline" class="quiet"><span id="partLabel"></span><i data-icon="chevDown"></i></button></div>
          <div class="trackBox"><div id="notches"></div><input id="track" aria-label="拖曳選擇本章事件" type="range" min="0" value="0" step="1"></div>
          <div class="trackLabels"><span id="startDate"></span><span id="timelineDate"></span><span id="endDate"></span></div>
          <div class="playButtons"><div class="transport"><button id="prev" class="step" aria-label="上一個事件" title="上一個事件（左方向鍵）"><i data-icon="prev"></i></button><button id="play" class="primary"></button><button id="next" class="step next" title="下一個事件（右方向鍵）"><span>下一事件</span><i data-icon="next"></i></button></div><select id="speed" aria-label="播放速度" title="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></div>
        </section>
      </section>
      <aside class="reader" aria-label="事件與國家資料">
        <div class="readerHead"><span><i data-icon="file"></i><span id="readerCaption">事件檔案</span></span><div class="readerTools"><button id="quickCause" class="quickCause" title="追蹤事件的前因與後果"><i data-icon="branch"></i>因果</button><button id="readerList" class="counter" title="顯示本章事件"></button></div></div>
        <article id="article" aria-live="polite" aria-atomic="false"></article>
      </aside>
    </div>
    <footer><span>時序地圖集 <b>／</b> {{title}}</span><div class="footerLinks"><button id="methodOpen">製圖說明與資料授權 <i data-icon="external"></i></button></div></footer>
  </main>
  <dialog id="dialog"><div class="dlgHead"><div><div class="kicker" id="dlgLabel"></div><h2 id="dlgTitle"></h2></div><button id="dlgClose" aria-label="關閉視窗" class="iconBtn"><i data-icon="close"></i></button></div><div id="dlgBody"></div></dialog>
  {{scripts}}
</body></html>
